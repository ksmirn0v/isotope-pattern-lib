[project]
name = "isotope-pattern-lib"
version = "0.1.0"
description = "A library to compute the isotope pattern of a given molecular formula"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Kirill S Smirnov", email = "kirill.smirnov.mail@gmail.com" }
]
keywords = ["isotope pattern", "mass spectrometry", "molecular formula"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/ksmirn0v/isotope-pattern-lib"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-bdd>=7.0",
    "pytest-cov>=5.0",
    "pytest-html>=4.0",
]
dev = [
    "mypy>=1.10",
    "pylint>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isotope_pattern_lib"]
